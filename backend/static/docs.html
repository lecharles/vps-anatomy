<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VPS Anatomy · API Reference</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
<link rel="stylesheet" href="/docs-theme.css" id="docs-css" />
<script>
  // Theme model for the docs page: vps (token theme, default), light, or
  // 'default' = the stock Swagger UI look with no overrides at all.
  // Persisted in the same key as the app ('vps.theme'); the app maps
  // 'default' to its own vps look.
  // S30 — ?theme= deep-links this page under the same contract the site
  // uses: the URL wins over the saved choice, but only values this page
  // offers. The app's 'academic' look has no docs mirror (S6b chose the
  // stock UI instead), so it lands on vps — the same fallback the saved
  // key already gets for it. One function answers both questions (before
  // paint and after) so the page can never disagree with itself.
  function pickDocsTheme() {
    var t = new URLSearchParams(location.search).get('theme');
    if (t !== 'vps' && t !== 'light' && t !== 'default') {
      t = localStorage.getItem('vps.theme') || 'vps';
    }
    if (t === 'stanford' || t === 'academic') t = 'vps';
    return t;
  }
  var docsTheme = pickDocsTheme();
  if (docsTheme === 'default') document.getElementById('docs-css').setAttribute('disabled', '');
  if (docsTheme === 'light') document.documentElement.setAttribute('data-theme', 'light');
</script>
</head>
<body>
<div class="docs-topbar">
  <a class="docs-brand" href="/">
    <span class="docs-mark"></span> VPS Anatomy <small>· API reference</small>
  </a>
  <div class="docs-actions">
    <a class="docs-link" href="/openapi.json">openapi.json</a>
    <div class="docs-theme-toggle" role="group" aria-label="Theme">
      <button data-set-theme="vps">VPS</button>
      <button data-set-theme="light">Light</button>
      <button data-set-theme="default">Default</button>
    </div>
  </div>
</div>
<div id="swagger"></div>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
  window.ui = SwaggerUIBundle({
    url: '/openapi.json',
    dom_id: '#swagger',
    deepLinking: true,
    displayRequestDuration: true,
    presets: [SwaggerUIBundle.presets.apis],
  });
  function applyDocsTheme(t) {
    const css = document.getElementById('docs-css');
    if (t === 'default') css.setAttribute('disabled', '');
    else css.removeAttribute('disabled');
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
    document.querySelectorAll('[data-set-theme]').forEach((b) =>
      b.classList.toggle('on', b.getAttribute('data-set-theme') === t));
  }
  function syncThemeParam(t) {
    var u = new URL(location.href);
    u.searchParams.set('theme', t);
    history.replaceState(history.state, '', u);
  }
  document.querySelectorAll('[data-set-theme]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const t = btn.getAttribute('data-set-theme');
      localStorage.setItem('vps.theme', t);
      syncThemeParam(t); // S30: the bar names what the page now draws — share it
      applyDocsTheme(t);
    });
  });
  var cur = docsTheme; // the same read the pre-paint pass made — one pick, no drift
  if (new URLSearchParams(location.search).has('theme')) {
    // A deep link is a deliberate choice: persist it to the shared key so
    // the site lands the same way, and rewrite the bar when the param
    // named something this page can't draw (academic lands on vps — the
    // bar then says vps, because the bar must match the paint). Without a
    // param nothing is written, so an app visitor's saved choice survives
    // opening docs in a side tab untouched.
    localStorage.setItem('vps.theme', cur);
    syncThemeParam(cur);
  }
  applyDocsTheme(cur);
</script>
</body>
</html>
